<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Grid Example</title>

    <style>
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .grid-item {
            padding: 30px;
            text-align: center;
            font-weight: bold;
        }

        .item1 {
            background-color: aqua;
        }

        .item2 {
            background-color: bisque;
        }

        .item3 {
            background-color: lightblue;
        }

        .item4 {
            background-color: lightgreen;
        }

        .item5 {
            background-color: pink;
        }

        .item6 {
            background-color: lightyellow;
        }
    </style>
</head>

<body>

    <h1>CSS Grid Example</h1>

    <div class="grid-container">

        <div class="grid-item item1">File</div>

        <div class="grid-item item2">Edit</div>

        <div class="grid-item item3">Selection</div>

        <div class="grid-item item4">View</div>

        <div class="grid-item item5">Go</div>

        <div class="grid-item item6">Run</div>

    </div>

</body>

</html>
